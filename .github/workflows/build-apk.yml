name: Build Release APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DANA_KEYSTORE_BASE64: ${{ secrets.DANA_KEYSTORE_BASE64 }}
      DANA_KEYSTORE_PASSWORD: ${{ secrets.DANA_KEYSTORE_PASSWORD }}
      DANA_KEY_ALIAS: ${{ secrets.DANA_KEY_ALIAS }}
      DANA_KEY_PASSWORD: ${{ secrets.DANA_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare signing key
        if: ${{ env.DANA_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$DANA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dana-release.jks"
          echo "DANA_KEYSTORE_FILE=$RUNNER_TEMP/dana-release.jks" >> "$GITHUB_ENV"
          echo "DANA_KEYSTORE_PASSWORD=$DANA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DANA_KEY_ALIAS=$DANA_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "DANA_KEY_PASSWORD=$DANA_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Prepare fallback signing key
        if: ${{ env.DANA_KEYSTORE_BASE64 == '' }}
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/dana-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "DANA_KEYSTORE_FILE=$RUNNER_TEMP/dana-debug.jks" >> "$GITHUB_ENV"
          echo "DANA_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "DANA_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "DANA_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Show and stage generated APKs
        shell: bash
        run: |
          set -e
          echo "Generated APK files:"
          find . -type f -path '*/build/outputs/apk/*/*.apk' -print || true
          mkdir -p artifact
          apk_count=0
          while IFS= read -r apk; do
            [ -n "$apk" ] || continue
            apk_count=$((apk_count + 1))
            name=$(basename "$apk")
            cp "$apk" "artifact/$name"
            echo "Staged: artifact/$name"
          done < <(find . -type f -path '*/build/outputs/apk/*/*.apk' -print)
          if [ "$apk_count" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi
          ls -lah artifact

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: challenge-dana-release-apk
          path: artifact/*.apk
          if-no-files-found: error
