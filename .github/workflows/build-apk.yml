name: Build Release APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare signing key
        if: ${{ secrets.DANA_KEYSTORE_BASE64 != '' }}
        env:
          DANA_KEYSTORE_BASE64: ${{ secrets.DANA_KEYSTORE_BASE64 }}
        run: |
          echo "$DANA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dana-release.jks"
          echo "DANA_KEYSTORE_FILE=$RUNNER_TEMP/dana-release.jks" >> "$GITHUB_ENV"
          echo "DANA_KEYSTORE_PASSWORD=${{ secrets.DANA_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "DANA_KEY_ALIAS=${{ secrets.DANA_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "DANA_KEY_PASSWORD=${{ secrets.DANA_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: challenge-dana-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
